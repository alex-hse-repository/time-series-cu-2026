# Единый конфиг линтера и форматтера для всего репозитория: и для ноутбуков
# занятий (`week_*/part_*/*.ipynb`), и для служебных скриптов (`scripts/`).
# Ruff понимает `.ipynb` нативно — отдельная обёртка вроде nbqa не нужна.

line-length = 100
target-version = "py311"

extend-exclude = [
  "**/.venv",
  "**/.ipynb_checkpoints",
  ".ci-notebooks",
  "examples_data",
]

[format]
# Код внутри docstring'ов и markdown-примеров тоже форматируется.
docstring-code-format = true

[lint]
select = [
  "F",    # pyflakes: неиспользуемые импорты и переменные, опечатки в именах
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "I",    # isort: порядок импортов
  "UP",   # pyupgrade: устаревшие конструкции
  "B",    # flake8-bugbear: типичные ошибки
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "PIE",  # flake8-pie: лишний код
  "RET",  # flake8-return
  "NPY",  # правила numpy
  "PD",   # pandas-vet
  "RUF",  # правила самого ruff
]

ignore = [
  # Репозиторий русскоязычный: кириллические буквы, «ёлочки» и тире в строках
  # и комментариях — норма, а не «похожий на латиницу» символ.
  "RUF001",
  "RUF002",
  "RUF003",
  # `df.values` в учебном коде читается не хуже `df.to_numpy()`.
  "PD011",
  # `df.pivot_table` вместо `unstack` — вопрос вкуса, для примеров не важен.
  "PD010",
  # Правила формата, конфликтующие с `ruff format`.
  "E111",
  "E114",
  "E117",
  "W191",
]

[lint.per-file-ignores]
"*.ipynb" = [
  # Импорты по ходу повествования — нормальная структура учебного ноутбука.
  "E402",
  # Длинные строки: обычно это URL, подписи к графикам и текстовые константы,
  # которые форматтер не переносит, а рвать вручную — портить читаемость.
  "E501",
  # `plt.plot(...); plt.show()` в одной строке — привычная для ноутбуков идиома.
  "E701",
  "E702",
  # Демонстрационные функции намеренно принимают неиспользуемые аргументы,
  # а переменные вроде `_` остаются от предыдущих ячеек.
  "B007",
  # `zip(..., strict=...)` в примерах для студентов — лишний шум.
  "B905",
  # Фиксированный seed через legacy-API numpy — так во всех учебниках.
  "NPY002",
]

[lint.isort]
known-first-party = ["scripts"]
