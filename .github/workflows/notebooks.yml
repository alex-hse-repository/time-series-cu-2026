name: Test notebooks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_all:
        description: "Прогнать все ноутбуки, а не только изменённые"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Диапазон, по которому считаются изменения; скрипт берёт его от точки
  # ветвления (`git diff base...head`).
  #
  # В PR это база и голова самого PR — в diff попадают только его коммиты,
  # независимо от того, сколько раз с тех пор обновилась main. Для push после
  # мержа `github.event.before` — предыдущий коммит main, то есть весь
  # смерженный PR. Для ручного запуска базы нет — прогоняется всё.
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RUN_ALL: ${{ inputs.run_all }}
  # Версия питона, на которой поднимаются окружения занятий. Занятия просят
  # `>=3.11`, поэтому без пина uv взял бы то, что стоит на раннере, и прогон
  # ездил бы вслед за образом ubuntu-latest.
  PYTHON_VERSION: "3.11.11"

jobs:
  detect:
    name: Detect changed weeks
    runs-on: ubuntu-latest
    outputs:
      weeks: ${{ steps.detect.outputs.weeks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        run: |
          weeks="$(python3 scripts/notebooks_ci.py list-weeks)"
          echo "Занятия к прогону: $weeks"
          echo "weeks=$weeks" >> "$GITHUB_OUTPUT"

  notebooks-test:
    name: ${{ matrix.week }}
    needs: detect
    if: needs.detect.outputs.weeks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        week: ${{ fromJSON(needs.detect.outputs.weeks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `python-version` ставит нужный интерпретатор и выставляет `UV_PYTHON`,
      # так что и `uv sync`, и `uv run` внутри скрипта берут именно его.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.week }}/uv.lock
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --project ${{ matrix.week }} --frozen

      - name: Run notebooks
        run: python3 scripts/notebooks_ci.py run --week ${{ matrix.week }}
