name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff (notebooks & scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Правила и исключения берутся из `ruff.toml` в корне репозитория.
      # Ноутбуки ruff понимает нативно, окружения занятий поднимать не нужно.
      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.13.0
          args: check --output-format github

      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.13.0
          args: format --check --diff
